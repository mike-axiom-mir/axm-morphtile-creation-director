name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: windows-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Load exact ecosystem pins
        id: pins
        run: node tools/emit-integration-pins.js
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.form_repository }}
          ref: ${{ steps.pins.outputs.form_commit }}
          path: .runtime/form
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.surface_repository }}
          ref: ${{ steps.pins.outputs.surface_commit }}
          path: .runtime/surface
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.capability_repository }}
          ref: ${{ steps.pins.outputs.capability_commit }}
          path: .runtime/capability
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.interface_repository }}
          ref: ${{ steps.pins.outputs.interface_commit }}
          path: .runtime/interface
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.assembly_repository }}
          ref: ${{ steps.pins.outputs.assembly_commit }}
          path: .runtime/assembly
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.verification_repository }}
          ref: ${{ steps.pins.outputs.verification_commit }}
          path: .runtime/verification
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.core_repository }}
          ref: ${{ steps.pins.outputs.core_commit }}
          path: .runtime/core
      - name: Unit tests
        run: npm test
      - name: Ecosystem integration
        shell: bash
        run: |
          set +e
          npm run test:integration > integration-test.log 2>&1
          code=$?
          cat integration-test.log
          exit $code
        env:
          MORPHTILE_ECOSYSTEM_ROOT: ${{ github.workspace }}/.runtime
      - name: Upload integration failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-failure-${{ matrix.os }}-node${{ matrix.node }}
          path: integration-test.log
          if-no-files-found: ignore
      - name: Creation proof
        run: npm run prove -- .proof
        env:
          MORPHTILE_ECOSYSTEM_ROOT: ${{ github.workspace }}/.runtime
      - uses: actions/upload-artifact@v4
        with:
          name: creation-${{ matrix.os }}-node${{ matrix.node }}
          path: .proof
