name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: windows-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-form
          ref: 39024ee1a0e0f4472a798accf3d3a0254a43e216
          path: .runtime/form
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-surface
          ref: a44a6a210e9099075cb67886f3d64187c3051924
          path: .runtime/surface
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-capability
          ref: edc07af182ee26ca1ceb64b5d5205591ec6aca9d
          path: .runtime/capability
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-interface
          ref: 77e833790358514c98e27cfcde6f5ab24c235264
          path: .runtime/interface
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-assembly
          ref: 5e8c37ce1423bfd0e18a33105c813e4f9689fd5b
          path: .runtime/assembly
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-verification
          ref: b584e15d6099f9aa97610f58dc1756a7188946d2
          path: .runtime/verification
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile
          ref: ef2b3c6986aa1a333247feffc43a8443f17239d0
          path: .runtime/core
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests
        run: npm test
      - name: Ecosystem integration
        shell: bash
        run: |
          set +e
          npm run test:integration > integration-test.log 2>&1
          code=$?
          cat integration-test.log
          exit $code
        env:
          MORPHTILE_ECOSYSTEM_ROOT: ${{ github.workspace }}/.runtime
      - name: Upload integration failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-failure-${{ matrix.os }}-node${{ matrix.node }}
          path: integration-test.log
          if-no-files-found: ignore
      - name: Creation proof
        run: npm run prove -- .proof
        env:
          MORPHTILE_ECOSYSTEM_ROOT: ${{ github.workspace }}/.runtime
      - uses: actions/upload-artifact@v4
        with:
          name: creation-${{ matrix.os }}-node${{ matrix.node }}
          path: .proof
